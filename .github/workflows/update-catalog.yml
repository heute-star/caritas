name: Actualizar Catálogo desde Excel

permissions:
  contents: write

on:
  push:
    paths:
      - 'inventario-disfraces.xlsx'
  workflow_dispatch:

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Install dependencies
        run: |
          pip install openpyxl
          
      - name: Convert Excel to JSON
        run: |
          python << 'EOF'
          import openpyxl
          import json
          import os
          
          print("🔍 Verificando archivo Excel...")
          
          # Verificar que el archivo existe
          if not os.path.exists('inventario-disfraces.xlsx'):
              print("❌ ERROR: No se encontró inventario-disfraces.xlsx")
              exit(1)
          
          print("✅ Archivo encontrado")
          
          # Leer Excel
          try:
              wb = openpyxl.load_workbook('inventario-disfraces.xlsx')
              print(f"📋 Hojas disponibles: {wb.sheetnames}")
              ws = wb['Inventario Disfraces']
              print("✅ Hoja 'Inventario Disfraces' encontrada")
          except Exception as e:
              print(f"❌ ERROR al abrir Excel: {e}")
              exit(1)
          
          disfraces = []
          
          # Saltar header (fila 1)
          for idx, row in enumerate(ws.iter_rows(min_row=2, values_only=True), start=2):
              if row[0] is None:  # Si no hay ID, saltar fila vacía
                  continue
              
              try:
                  disfraz = {
                      "id": int(row[0]),
                      "nombre": str(row[2]),  # Nombre completo descriptivo
                      "categoria": str(row[3]).lower(),
                      "edad": str(row[4]).lower(),
                      "genero": str(row[5]).lower() if row[5] else "unisex",
                      "imagen": f"images/disfraces/{row[1]}",
                      "imagen_thumb": f"images/disfraces/{row[1]}"
                  }
                  disfraces.append(disfraz)
                  print(f"✅ Fila {idx}: {disfraz['nombre']}")
              except Exception as e:
                  print(f"⚠️  Error en fila {idx}: {e}")
                  continue
          
          # Crear directorio data si no existe
          os.makedirs('data', exist_ok=True)
          
          # Guardar JSON
          with open('data/disfraces.json', 'w', encoding='utf-8') as f:
              json.dump(disfraces, f, ensure_ascii=False, indent=2)
          
          print(f"✅ Convertidos {len(disfraces)} disfraces a JSON")
          print("📄 Archivo guardado en: data/disfraces.json")
          EOF
          
      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/disfraces.json
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Actualizar catálogo desde Excel"
          
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
